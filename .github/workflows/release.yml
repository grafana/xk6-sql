name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions: {}

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.go-versions.outputs.current }}
    steps:
      - name: Resolve Go versions
        id: go-versions
        uses: grafana/k6-ci/.github/actions/go-versions@03469f9ae7aad25369827832c456e8f8b7b8c1c2 # v0.5.0

  release:
    name: Release
    needs: configure
    uses: grafana/xk6/.github/workflows/extension-release.yml@b302a90014ee698bbf3c9f7c908b79ec8dd8053b # v1.4.6
    permissions:
      contents: write
    with:
      cgo: true
      go-version: ${{ needs.configure.outputs.current }}
      os: '["linux", "windows", "darwin"]'
      arch: '["amd64", "arm64"]'
      k6-version: "v2.0.0-rc1"
      xk6-version: "1.4.1"
      # TEMPORARY: keep SQL driver extensions disabled until they release with k6 v2 support.
      # If included now, they still pull k6 v1, which conflicts with xk6-sql using k6 v2.
      # with: |
      #   github.com/grafana/xk6-sql-driver-ramsql
      #   github.com/grafana/xk6-sql-driver-sqlite3
      #   github.com/grafana/xk6-sql-driver-mysql
      #   github.com/grafana/xk6-sql-driver-postgres
